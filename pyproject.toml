[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-harness"
version = "0.1.0"
description = "Measure whether the layer you built on top of an LLM helps or hurts."
readme = "README.md"
requires-python = ">=3.10"
# Aucune dépendance d'exécution, volontairement: HTTP via urllib, statistiques
# via math. Un outil de mesure ne doit pas imposer un arbre de dépendances à
# celui qui veut vérifier un chiffre.
dependencies = []

[project.optional-dependencies]
hf = ["transformers>=4.40", "torch>=2.2"]

[project.scripts]
scaffold-harness = "scaffold_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 90
target-version = "py310"

# Les règles sont déclarées explicitement pour que la barrière d'intégration
# continue ne change pas de comportement quand ruff sort une nouvelle version.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "ISC", "RUF"]
# Le dépôt est bilingue: guillemets français, apostrophes typographiques et
# espaces insécables sont voulus, pas des homoglyphes accidentels.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Des doublures d'une ligne: la lambda dit ce qu'elle fait mieux qu'un `def`
# nommé à usage unique. La règle garde tout son sens dans `src/`.
"tests/*" = ["E731"]
